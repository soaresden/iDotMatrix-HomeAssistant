set_face:
  name: Set face
  description: Apply a layered face configuration from the designer.
  fields:
    face:
      required: true
      description: Face configuration with layers and optional trigger_entity.
      example:
        {
          "layers": [
            {
              "id": "1",
              "template": "{{ now().strftime('%H:%M') }}",
              "x": 0,
              "y": 8,
              "color": [0, 255, 0],
              "font_size": 10
            }
          ],
          "trigger_entity": "sensor.time"
        }
      selector:
        object:

set_saved_design:
  name: Set saved design
  description: Apply a saved design by name.
  fields:
    name:
      required: true
      example: "My Design"
      selector:
        text:

render_preview:
  name: Render preview
  description: Render a face preview image and return a base64 PNG.
  fields:
    face:
      required: true
      selector:
        object:
    screen_size:
      required: false
      example: 32
      selector:
        number:
          min: 8
          max: 64
          mode: box

list_fonts:
  name: List fonts
  description: Return available fonts for the designer.

display_gif:
  name: Display GIF
  description: Display animated GIFs on the iDotMatrix device. Can show a single GIF or rotate through a folder of GIFs.
  fields:
    path:
      required: true
      description: Path to a GIF file or folder containing GIF files.
      example: "/config/www/idotmatrix/gifs"
      selector:
        text:
    rotation_interval:
      required: false
      description: Carousel interval - how long each GIF displays before advancing to the next (batch mode only). The device handles the rotation natively. Common values are 5, 10, 30, 60, or 255 seconds.
      default: 5
      example: 10
      selector:
        number:
          min: 1
          max: 255
          unit_of_measurement: seconds
          mode: box

convert_media:
  name: Convert media
  description: >
    Turn an image, GIF or video into a GIF sized and tuned for the display,
    small enough to upload quickly. Videos need ffmpeg (bundled with Home
    Assistant OS). Returns the output path and the settings that were used.
  fields:
    source:
      required: true
      description: Path to the image, GIF or video to convert.
      example: "/media/uploads/cat.mp4"
      selector:
        text:
    output:
      required: false
      description: Where to write the GIF. Defaults to /media/idotmatrix/<name>_<size>.gif.
      example: "/media/idotmatrix/cat.gif"
      selector:
        text:
    pixel_size:
      required: false
      description: Output size in pixels. Defaults to the configured screen size.
      selector:
        select:
          options: ["16", "32", "64"]
    fit:
      required: false
      description: crop fills the screen, fit keeps everything with black bars, stretch distorts.
      default: crop
      selector:
        select:
          options: ["crop", "fit", "stretch"]
    crop:
      required: false
      description: Region of the source to keep, as fractions [x, y, width, height] (0-1).
      example: "[0.25, 0, 0.5, 1]"
      selector:
        object:
    start:
      required: false
      description: Start of the clip in seconds (videos and animations).
      selector:
        number:
          min: 0
          max: 36000
          step: 0.1
          unit_of_measurement: seconds
          mode: box
    end:
      required: false
      description: End of the clip in seconds.
      selector:
        number:
          min: 0
          max: 36000
          step: 0.1
          unit_of_measurement: seconds
          mode: box
    max_seconds:
      required: false
      description: Maximum clip length.
      default: 12
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          unit_of_measurement: seconds
    fps:
      required: false
      description: Frames per second sampled from videos (default 12). Lowered automatically if the GIF is too large.
      selector:
        number:
          min: 1
          max: 30
    max_kb:
      required: false
      description: Size budget. Colors, frame rate and finally length are reduced until the GIF fits.
      default: 96
      selector:
        number:
          min: 4
          max: 1024
          unit_of_measurement: KB
          mode: box
    brightness:
      required: false
      default: 1.0
      selector:
        number:
          min: 0
          max: 3
          step: 0.05
    contrast:
      required: false
      default: 1.1
      selector:
        number:
          min: 0
          max: 3
          step: 0.05
    saturation:
      required: false
      default: 1.25
      selector:
        number:
          min: 0
          max: 3
          step: 0.05
    gamma:
      required: false
      description: Above 1 darkens mid-tones, below 1 lifts them.
      default: 1.0
      selector:
        number:
          min: 0.2
          max: 5
          step: 0.05
    black_level:
      required: false
      description: Pixels darker than this are switched off instead of glowing faintly.
      default: 16
      selector:
        number:
          min: 0
          max: 255
    dither:
      required: false
      description: Error-diffusion dithering. Smoother gradients, but larger files and shimmer on the panel.
      default: false
      selector:
        boolean:
    boomerang:
      required: false
      description: Play the clip forward then backward for a seamless loop.
      default: false
      selector:
        boolean:
    display:
      required: false
      description: Show the result on the display once converted.
      default: false
      selector:
        boolean:

stop_gif_rotation:
  name: Stop GIF Rotation
  description: Stop the current GIF rotation if one is running.

show_weather:
  name: Show weather dashboard
  description: >
    Display an animated weather dashboard with pixel-art condition icons,
    temperature, high/low, humidity and wind. Data comes from a weather
    entity, individual sensors, or a mix of both (sensor overrides win).
    By default the display keeps updating automatically when the source
    entities change.
  fields:
    weather_entity:
      required: false
      description: Weather entity used for condition, temperature, humidity, wind and forecast high/low.
      default: weather.openweathermap
      example: weather.openweathermap
      selector:
        entity:
          domain: weather
    condition_entity:
      required: false
      description: Sensor overriding the condition. Accepts HA conditions or free text like "broken clouds" / "light rain" (e.g. an OpenWeatherMap weather sensor).
      example: sensor.openweathermap_weather
      selector:
        entity:
          domain: sensor
    temperature_entity:
      required: false
      description: Sensor overriding the temperature (e.g. a local weather station).
      example: sensor.gw2000b_outdoor_temperature
      selector:
        entity:
          domain: sensor
    humidity_entity:
      required: false
      description: Sensor overriding the humidity.
      example: sensor.gw2000b_humidity
      selector:
        entity:
          domain: sensor
    wind_entity:
      required: false
      description: Sensor overriding the wind speed.
      selector:
        entity:
          domain: sensor
    high_entity:
      required: false
      description: Sensor overriding today's forecast high.
      selector:
        entity:
          domain: sensor
    low_entity:
      required: false
      description: Sensor overriding today's forecast low.
      selector:
        entity:
          domain: sensor
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full dashboard, 32 a compact layout.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically when source entities change (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_weather:
  name: Stop weather dashboard
  description: Stop weather dashboard auto-updates.

show_bitcoin:
  name: Show Bitcoin ticker
  description: >
    Display an animated Bitcoin price ticker with a spinning pixel-art
    Bitcoin coin. The price is colored by the direction of its last move
    (green up, red down). By default the display keeps updating
    automatically when the price changes.
  fields:
    logo:
      required: false
      description: >
        Logo filename from custom_components/idotmatrix/images/.
        Defaults to bitcoin_logo.png. If the file is missing, the built-in
        fallback text Bitcoin logo is used.
      default: bitcoin_logo.png
      example: ethereum.png
      selector:
        text:
    price_entity:
      required: false
      description: Sensor with the current USD price. Defaults to sensor.bitcoin_price.
      default: sensor.bitcoin_price
      example: sensor.bitcoin_price
      selector:
        entity:
          domain: sensor
    change_entity:
      required: false
      description: Optional sensor with the 24h change percentage, shown below the price.
      selector:
        entity:
          domain: sensor
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full ticker, 32 a compact layout.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically when the price changes (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_bitcoin:
  name: Stop Bitcoin ticker
  description: Stop Bitcoin ticker auto-updates.

show_co2:
  name: Show CO2 gauge
  description: >
    Display a CO2 concentration gauge with a color-coded bar and status
    label (Good/OK/Fair/Poor/Bad). The gauge updates automatically when
    the sensor value changes.
  fields:
    co2_entity:
      required: true
      description: Sensor with the current CO2 concentration in ppm.
      example: sensor.living_room_co2
      selector:
        entity:
          domain: sensor
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full gauge, 32 a compact layout.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically when the CO2 level changes (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_co2:
  name: Stop CO2 gauge
  description: Stop CO2 gauge auto-updates.

show_power:
  name: Show power gauge
  description: >
    Display whole-house power usage with a color-coded bar gauge scaled
    0-5000 W and a status label (Low/Norm/Med/High/Peak/Max). The gauge
    updates automatically (at most every 15s) as the power sensor changes.
    If thermostats are given, the caption flags when the furnace or AC is
    running so a spike explains itself.
  fields:
    power_entity:
      required: true
      description: Sensor with the current total active power in watts.
      example: sensor.home_power
      selector:
        entity:
          domain: sensor
    heat_entity:
      required: false
      description: Heating thermostat; when it reports heating, the caption shows a flame and "HEAT ON".
      selector:
        entity:
          domain: climate
    cool_entity:
      required: false
      description: Cooling thermostat; when it reports cooling, the caption shows a snowflake and "AC ON".
      selector:
        entity:
          domain: climate
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full gauge, 32 a compact layout.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically when power usage changes (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_power:
  name: Stop power gauge
  description: Stop power gauge auto-updates.

show_thermostat:
  name: Show thermostat status
  description: >
    Display the heating and cooling thermostats as two stacked panels: a
    flame or snowflake icon, ON/IDLE/OFF status, the room temperature and
    the setpoint. Icons animate while a zone is actively running. Updates
    automatically as the climate entities change.
  fields:
    heat_entity:
      required: false
      description: Climate entity for the heating zone (top panel).
      selector:
        entity:
          domain: climate
    cool_entity:
      required: false
      description: Climate entity for the cooling zone (bottom panel).
      selector:
        entity:
          domain: climate
    pixel_size:
      required: false
      description: Display resolution. 64 renders both panels in full, 32 a compact icon + temperature list.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically when the thermostats change (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_thermostat:
  name: Stop thermostat status
  description: Stop thermostat status auto-updates.

show_sun:
  name: Show sunrise / sunset arc
  description: >
    Display a horizon with the sun travelling an arc from sunrise to
    sunset (the moon takes the arc at night). Shows sunrise and sunset
    times, daylight length and a countdown to the next event. Uses the
    home location configured in Home Assistant; refreshes every minute.
  fields:
    hour24:
      required: false
      description: Show sunrise/sunset times in 24-hour format (default true).
      default: true
      selector:
        boolean:
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full layout, 32 a compact arc with the next event time.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_sun:
  name: Stop sunrise / sunset arc
  description: Stop sun arc auto-updates.

show_moon:
  name: Show moon phase
  description: >
    Display the current moon phase as a large disc with the correct
    terminator shape, the phase name, the illuminated percentage and the
    days until the next full or new moon. Computed from the date, so no
    entity is needed; the lit side is mirrored in the southern hemisphere.
    Refreshes hourly.
  fields:
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full layout, 32 a compact disc with the illumination.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the display updated automatically (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_moon:
  name: Stop moon phase
  description: Stop moon phase auto-updates.

show_message:
  name: Show message
  description: >
    Push a one-shot message to the panel from any automation. Pick a style
    (card, alert, marquee, party, typewriter), an optional icon, a color or
    rainbow text, and the house pixel font or the Press Start 2P arcade
    font. When the duration elapses the display that was showing before
    (weather, moon, photos, ...) comes back on its own. A darkened panel
    is woken for the message and darkened again afterwards.
  fields:
    message:
      required: true
      description: The text to show. Use a newline to force a line break.
      example: Front door open
      selector:
        text:
          multiline: true
    style:
      required: false
      description: >
        card = icon + wrapped text (long text pages every 3s);
        alert = card with pulsing border and blinking icon;
        marquee = ticker scrolling past a pinned icon;
        party = one word at a time in random colors with confetti;
        typewriter = characters appear behind a blinking cursor.
      default: card
      selector:
        select:
          options:
            - card
            - alert
            - marquee
            - party
            - typewriter
    icon:
      required: false
      description: Optional 16x16 icon.
      selector:
        select:
          options:
            - alert
            - bell
            - bolt
            - car
            - check
            - coffee
            - cross
            - dog
            - door
            - drop
            - flame
            - gift
            - heart
            - home
            - info
            - mail
            - moon
            - music
            - package
            - phone
            - snowflake
            - star
            - sun
            - timer
    color:
      required: false
      description: Text color. Defaults to white (phosphor green for typewriter).
      selector:
        color_rgb:
    rainbow:
      required: false
      description: Animated rainbow text instead of a single color.
      default: false
      selector:
        boolean:
    font:
      required: false
      description: pixel = the 5x7 house font; arcade = Press Start 2P (8x8, has lowercase); tiny = minimalist 3x5 that fits 15 characters per line.
      default: pixel
      selector:
        select:
          options:
            - pixel
            - arcade
            - tiny
    duration:
      required: false
      description: Seconds to show the message before restoring the previous display. 0 keeps it until stop_message.
      default: 15
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
    pixel_size:
      required: false
      description: Display resolution. 64 renders the full styles, 32 a compact card.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"

stop_message:
  name: Stop message
  description: End the current message early and restore the previous display.

show_clock:
  name: Show clock
  description: >
    Display a clock. The default "pixel" face is rendered by the
    integration in the house pixel-art style (big HH:MM with a blinking
    colon, weekday, date); "analog" is a minimal dial with accent ticks,
    smooth hands and a pulsing center dot. Both are re-uploaded each
    minute. Faces 0-7 use the device's built-in firmware clock styles,
    which keep time on the panel itself with no further BLE traffic.
  fields:
    face:
      required: false
      description: '"pixel" or "analog" for the custom rendered faces, or a native firmware style 0-7.'
      default: pixel
      selector:
        select:
          options:
            - "pixel"
            - "analog"
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
            - "7"
    color:
      required: false
      description: Accent color (defaults to sky blue for the pixel face, green for analog) or text color for native styles.
      selector:
        color_rgb:
    hour24:
      required: false
      description: 24-hour format (default true).
      default: true
      selector:
        boolean:
    show_date:
      required: false
      description: Show the date (default true).
      default: true
      selector:
        boolean:
    pixel_size:
      required: false
      description: Display resolution for the pixel face. 64 renders the full layout, 32 a compact one.
      default: 64
      selector:
        select:
          options:
            - "64"
            - "32"
    follow:
      required: false
      description: Keep the pixel face updated every minute (default true). Set false for a one-shot render.
      default: true
      selector:
        boolean:

stop_clock:
  name: Stop clock
  description: Stop clock updates (pixel face) and clock mode tracking.

show_color:
  name: Show fullscreen color
  description: Replace the active display with a solid color for a visual notification. Use black to clear the panel.
  fields:
    color:
      required: true
      example: [255, 0, 0]
      selector:
        color_rgb:

disconnect:
  name: Disconnect panel
  description: Release Bluetooth for the phone app and suspend writes until reconnect is called.

reconnect:
  name: Reconnect panel
  description: Reconnect Bluetooth and resume Home Assistant control.
